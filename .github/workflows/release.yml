name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (without v prefix)'
        required: true
        type: string
      docker_only:
        description: 'Only build Docker images'
        required: false
        type: boolean
        default: false
      release_notes:
        description: 'Optional release notes markdown. Falls back to tag annotation or commit log.'
        required: false
        type: string

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      commit: ${{ steps.resolve_release.outputs.commit }}
      short_commit: ${{ steps.resolve_release.outputs.short_commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Resolve release commit
        id: resolve_release
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_REF="refs/tags/v${VERSION}"
            git fetch --force origin "${RELEASE_REF}:${RELEASE_REF}"
          else
            RELEASE_REF="${GITHUB_REF}"
          fi

          git fetch origin main
          RELEASE_COMMIT=$(git rev-parse "${RELEASE_REF}^{commit}")

          if ! git merge-base --is-ancestor "${RELEASE_COMMIT}" origin/main; then
            echo "::error::Release tag v${VERSION} does not point to a commit on main."
            exit 1
          fi

          echo "commit=${RELEASE_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "short_commit=${RELEASE_COMMIT:0:8}" >> "$GITHUB_OUTPUT"
          echo "Release v${VERSION} resolves to ${RELEASE_COMMIT}."

      - name: Require successful CI for release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.resolve_release.outputs.commit }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 360); do
            RESPONSE=$(gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="${RELEASE_COMMIT}" \
              -f branch=main \
              -f event=push \
              -f per_page=10)
            RUN=$(jq -c --arg sha "${RELEASE_COMMIT}" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | reverse | .[0] // empty' \
              <<<"${RESPONSE}")

            if [ -z "${RUN}" ]; then
              echo "Waiting for CI to start for ${RELEASE_COMMIT} (attempt ${attempt}/360)..."
              sleep 15
              continue
            fi

            STATUS=$(jq -r '.status' <<<"${RUN}")
            CONCLUSION=$(jq -r '.conclusion // ""' <<<"${RUN}")
            RUN_URL=$(jq -r '.html_url' <<<"${RUN}")

            if [ "${STATUS}" = "completed" ]; then
              if [ "${CONCLUSION}" = "success" ]; then
                echo "Verified successful CI for ${RELEASE_COMMIT}: ${RUN_URL}"
                exit 0
              fi

              echo "::error::CI for ${RELEASE_COMMIT} concluded ${CONCLUSION}: ${RUN_URL}"
              exit 1
            fi

            echo "CI for ${RELEASE_COMMIT} is ${STATUS}; waiting: ${RUN_URL}"
            sleep 15
          done

          echo "::error::Timed out waiting for CI on ${RELEASE_COMMIT}."
          exit 1

  build-binaries:
    name: Build Binaries
    needs: validate
    if: ${{ !inputs.docker_only }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            flavor: pg
            package: ./cmd/orisun-pg
            binary: orisun-pg
          - os: linux
            arch: arm64
            flavor: pg
            package: ./cmd/orisun-pg
            binary: orisun-pg
          - os: darwin
            arch: amd64
            flavor: pg
            package: ./cmd/orisun-pg
            binary: orisun-pg
          - os: darwin
            arch: arm64
            flavor: pg
            package: ./cmd/orisun-pg
            binary: orisun-pg
          - os: windows
            arch: amd64
            flavor: pg
            package: ./cmd/orisun-pg
            binary: orisun-pg
            extension: .exe
          - os: linux
            arch: amd64
            flavor: sqlite
            package: ./cmd/orisun-sqlite
            binary: orisun-sqlite
          - os: linux
            arch: arm64
            flavor: sqlite
            package: ./cmd/orisun-sqlite
            binary: orisun-sqlite
          - os: darwin
            arch: amd64
            flavor: sqlite
            package: ./cmd/orisun-sqlite
            binary: orisun-sqlite
          - os: darwin
            arch: arm64
            flavor: sqlite
            package: ./cmd/orisun-sqlite
            binary: orisun-sqlite
          - os: windows
            arch: amd64
            flavor: sqlite
            package: ./cmd/orisun-sqlite
            binary: orisun-sqlite
            extension: .exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Build binary
        run: |
          mkdir -p build
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
            -ldflags="-w -s -X 'github.com/OrisunLabs/Orisun/orisun.Version=v${{ needs.validate.outputs.version }}' -X 'github.com/OrisunLabs/Orisun/orisun.BuildTime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')' -X 'github.com/OrisunLabs/Orisun/orisun.GitCommit=${{ needs.validate.outputs.short_commit }}'" \
            -o build/${{ matrix.binary }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension || '' }} \
            ${{ matrix.package }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.os }}-${{ matrix.arch }}
          path: build/${{ matrix.binary }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension || '' }}
          if-no-files-found: error



  build-fdb:
    name: Build FoundationDB Binary (${{ matrix.arch }})
    needs: validate
    if: ${{ !inputs.docker_only }}
    runs-on: ${{ matrix.runner }}
    env:
      FDB_VERSION: '7.3.77'
    strategy:
      matrix:
        include:
          - arch: amd64
            deb_arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            deb_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          check-latest: true

      # The FDB Go binding is cgo and links libfdb_c at build and run time, so the
      # binary is built natively per arch (no cross-compile) against the installed
      # client package.
      - name: Install FoundationDB client library
        run: |
          curl -fsSL -o /tmp/clients.deb \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_${{ matrix.deb_arch }}.deb"
          sudo dpkg -i /tmp/clients.deb

      - name: Build binary
        run: |
          mkdir -p build
          CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.arch }} go build \
            -tags foundationdb \
            -ldflags="-X 'github.com/OrisunLabs/Orisun/orisun.Version=v${{ needs.validate.outputs.version }}' -X 'github.com/OrisunLabs/Orisun/orisun.BuildTime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')' -X 'github.com/OrisunLabs/Orisun/orisun.GitCommit=${{ needs.validate.outputs.short_commit }}'" \
            -o build/orisun-fdb-linux-${{ matrix.arch }} \
            ./cmd/orisun-fdb

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: orisun-fdb-linux-${{ matrix.arch }}
          path: build/orisun-fdb-linux-${{ matrix.arch }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [validate, build-binaries, build-fdb]
    if: ${{ !inputs.docker_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}
          submodules: recursive

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        id: release_notes
        env:
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          cat > release-notes.md <<EOF
          ## Orisun v${VERSION}

          EOF

          MANUAL_NOTES="$RELEASE_NOTES_INPUT"
          if [ -n "$MANUAL_NOTES" ]; then
            printf "%s\n" "$MANUAL_NOTES" >> release-notes.md
          elif [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            git fetch --force origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
            TAG_NOTES=$(git tag -l "v${VERSION}" --format='%(contents)' | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d')
            if [ -n "$TAG_NOTES" ] && [ "$TAG_NOTES" != "Release v${VERSION}" ]; then
              printf "%s\n" "$TAG_NOTES" >> release-notes.md
            fi
          fi

          if [ "$(wc -l < release-notes.md | tr -d ' ')" -le 2 ]; then
            if [ -z "$PREVIOUS_TAG" ]; then
              echo "Initial release" >> release-notes.md
            else
              echo "## Changes" >> release-notes.md
              echo "" >> release-notes.md
              git log --pretty=format:"* %s (%h)" "$PREVIOUS_TAG"..HEAD >> release-notes.md
              echo "" >> release-notes.md
            fi
          fi

          cat >> release-notes.md <<EOF

          ## Installation

          ### Linux
          \`\`\`bash
          # PostgreSQL-only binary
          curl -L https://github.com/OrisunLabs/Orisun/releases/download/v${VERSION}/orisun-pg-linux-amd64 -o orisun-pg
          chmod +x orisun-pg

          # SQLite-only binary
          curl -L https://github.com/OrisunLabs/Orisun/releases/download/v${VERSION}/orisun-sqlite-linux-amd64 -o orisun-sqlite
          chmod +x orisun-sqlite

          # FoundationDB-only binary (Linux only; requires the FoundationDB
          # client library installed: foundationdb-clients ${FDB_VERSION:-7.3.x})
          curl -L https://github.com/OrisunLabs/Orisun/releases/download/v${VERSION}/orisun-fdb-linux-amd64 -o orisun-fdb
          chmod +x orisun-fdb
          \`\`\`

          ### macOS
          \`\`\`bash
          # PostgreSQL-only binary for Apple Silicon
          curl -L https://github.com/OrisunLabs/Orisun/releases/download/v${VERSION}/orisun-pg-darwin-arm64 -o orisun-pg
          chmod +x orisun-pg

          # SQLite-only binary for Apple Silicon
          curl -L https://github.com/OrisunLabs/Orisun/releases/download/v${VERSION}/orisun-sqlite-darwin-arm64 -o orisun-sqlite
          chmod +x orisun-sqlite
          \`\`\`

          ### Windows
          Download the PostgreSQL-only or SQLite-only binary from the assets below.

          ### Docker
          \`\`\`bash
          docker pull orisunlabs/orisun:${VERSION}-pg
          docker pull orisunlabs/orisun:${VERSION}-sqlite
          docker pull orisunlabs/orisun:${VERSION}-fdb
          \`\`\`

          Channel tags are also available: \`pg\`, \`sqlite\`, and \`fdb\`.
          EOF

          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release v${{ needs.validate.outputs.version }}
          body_path: ${{ steps.release_notes.outputs.path }}
          files: |
            artifacts/**/*
          draft: false
          prerelease: false

  docker-release:
    name: Build and Push Docker Image (${{ matrix.flavor }})
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ needs.validate.result == 'success' }}
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - flavor: pg
            channel_tag: pg
            version_suffix: -pg
            dockerfile: Dockerfile
          - flavor: sqlite
            channel_tag: sqlite
            version_suffix: -sqlite
            dockerfile: Dockerfile
          - flavor: fdb
            channel_tag: fdb
            version_suffix: -fdb
            dockerfile: Dockerfile.fdb
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        # The Docker Hub account/token must have Read & Write access to
        # https://hub.docker.com/repository/docker/orisunlabs/orisun

      - name: Set Docker build metadata
        id: docker_meta
        run: |
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "git_commit=${{ needs.validate.outputs.short_commit }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            FLAVOR=${{ matrix.flavor }}
            BUILD_TIME=${{ steps.docker_meta.outputs.build_time }}
            GIT_COMMIT=${{ steps.docker_meta.outputs.git_commit }}
          tags: |
            ghcr.io/orisunlabs/orisun:${{ matrix.channel_tag }}
            ghcr.io/orisunlabs/orisun:${{ needs.validate.outputs.version }}${{ matrix.version_suffix }}
            orisunlabs/orisun:${{ matrix.channel_tag }}
            orisunlabs/orisun:${{ needs.validate.outputs.version }}${{ matrix.version_suffix }}
